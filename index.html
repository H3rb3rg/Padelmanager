<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Padel Turnier Manager</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0A211D">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Padel">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- Cloud sync (optional): only activates once firebase-config.js has real keys.
     Without it, the app still works but tournament data stays on-device only. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.16.0/firebase-firestore-compat.min.js"></script>
<script src="firebase-config.js"></script>
<style>
  :root{
    --ink:#0A211D;
    --court:#0F6E5C;
    --court-2:#0B5647;
    --line:#DCE7DD;
    --ball:#CFE64A;
    --ball-dark:#9DB828;
    --paper:#F4F2E9;
    --paper-dim:#E7E3D3;
    --panel:#123B33;
    --panel-2:#164A40;
    --coral:#E4572E;
    --text-soft:#B9CFC7;
    --radius:14px;
    --pcourt:#0E5FA8;
    --pcourt-2:#0B4C87;
    --pcourt-3:#0C3F70;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 46px),
      linear-gradient(160deg, var(--ink) 0%, #071713 100%);
    min-height:100vh;
    font-family:'Inter',sans-serif;
    color:var(--paper);
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--ink);
    display:flex;
    flex-direction:column;
    position:relative;
    border-left:1px solid rgba(255,255,255,0.05);
    border-right:1px solid rgba(255,255,255,0.05);
  }
  .display{font-family:'Bebas Neue',sans-serif; letter-spacing:0.5px;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .screen{padding:20px 18px 100px 18px; flex:1;}
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg, var(--ink) 70%, rgba(10,33,29,0));
    padding:18px 18px 10px 18px;
    display:flex; align-items:center; gap:10px;
  }
  .back-btn{
    width:36px;height:36px;border-radius:50%;
    background:var(--panel); border:1px solid rgba(255,255,255,0.08);
    color:var(--paper); display:flex;align-items:center;justify-content:center;
    cursor:pointer; font-size:18px; flex-shrink:0;
  }
  .topbar h1{display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.5px;margin:0;color:var(--paper);flex:1;line-height:1.1;}
  .topbar .sub{font-size:11px;color:var(--text-soft);margin-top:1px;}
  .brand{
    display:flex;align-items:center;gap:10px;padding:6px 4px 22px 4px;
  }
  .brand .ball-dot{width:14px;height:14px;border-radius:50%;background:var(--ball); box-shadow:0 0 0 4px rgba(207,230,74,0.15);}
  .brand .lockup{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--paper);}
  .brand .lockup span{color:var(--ball);}
  .hero-line{
    height:2px; width:100%;
    background:repeating-linear-gradient(90deg, var(--line) 0 10px, transparent 10px 18px);
    opacity:0.25; margin:4px 0 20px 0;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 18px; border-radius:12px; border:none;
    font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
    cursor:pointer; width:100%; transition:transform .1s ease;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--ball); color:#12280F;}
  .btn-secondary{background:var(--panel); color:var(--paper); border:1px solid rgba(255,255,255,0.12);}
  .btn-ghost{background:transparent; color:var(--paper); border:1px dashed rgba(255,255,255,0.25);}
  .btn-danger{background:transparent;color:var(--coral); border:1px solid rgba(228,87,46,0.4);}
  .btn-sm{padding:9px 14px; font-size:13px; width:auto;}
  .btn:disabled{opacity:0.35; cursor:not-allowed;}
  .stack{display:flex; flex-direction:column; gap:12px;}
  .row{display:flex; gap:10px;}
  .card{
    background:var(--panel); border:1px solid rgba(255,255,255,0.07);
    border-radius:var(--radius); padding:16px;
  }
  .card.clickable{cursor:pointer;}
  .card.clickable:active{background:var(--panel-2);}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:12px; color:var(--text-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
  .input{
    background:var(--ink); border:1px solid rgba(255,255,255,0.12);
    border-radius:10px; padding:12px 14px; color:var(--paper);
    font-family:'Inter',sans-serif; font-size:15px; width:100%;
  }
  .input:focus{outline:none; border-color:var(--ball);}
  .input.code-input{
    font-family:'JetBrains Mono',monospace; letter-spacing:6px; text-transform:uppercase;
    text-align:center; font-size:20px; font-weight:700;
  }
  .empty{
    text-align:center; padding:36px 16px; color:var(--text-soft);
  }
  .empty .ball-icon{font-size:34px; margin-bottom:10px; display:block;}
  .tourn-card{
    background:var(--panel); border-radius:var(--radius); padding:16px 44px 16px 16px;
    border-left:4px solid var(--ball); cursor:pointer; position:relative;
  }
  .tourn-card:active{background:var(--panel-2);}
  .tourn-card .name{font-family:'Bebas Neue'; font-size:22px; letter-spacing:0.4px;}
  .tourn-card .meta{font-size:12px; color:var(--text-soft); margin-top:4px; display:flex; gap:10px; flex-wrap:wrap;}
  .tourn-card .delete-icon{position:absolute; top:10px; right:8px; font-size:16px; padding:6px; color:var(--text-soft);}
  .tourn-card .delete-icon:active{color:var(--coral);}
  .pill{
    display:inline-flex; align-items:center; gap:5px;
    background:rgba(207,230,74,0.12); color:var(--ball);
    padding:3px 9px; border-radius:100px; font-size:11px; font-weight:700;
    text-transform:uppercase; letter-spacing:0.4px;
  }
  .pill.muted{background:rgba(255,255,255,0.06); color:var(--text-soft);}
  .type-option{
    border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius);
    padding:14px; cursor:pointer; background:var(--panel);
  }
  .type-option.selected{border-color:var(--ball); background:var(--panel-2); box-shadow:0 0 0 1px var(--ball) inset;}
  .type-option.disabled{opacity:0.4; cursor:not-allowed;}
  .type-option .t-name{font-weight:700; font-size:15px;}
  .type-option .t-desc{font-size:12px; color:var(--text-soft); margin-top:2px;}
  .team-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px;
    background:var(--panel); border-radius:12px; border:1px solid rgba(255,255,255,0.06);
  }
  .team-avatar{
    width:38px;height:38px;border-radius:10px; background:var(--court);
    display:flex;align-items:center;justify-content:center; font-family:'Bebas Neue';
    font-size:17px; color:var(--paper); flex-shrink:0;
  }
  .team-row .t-info{flex:1; min-width:0;}
  .team-row .t-name{font-weight:700; font-size:15px;}
  .team-row .t-players{font-size:12px; color:var(--text-soft);}
  .icon-btn{
    background:none; border:none; color:var(--text-soft); cursor:pointer; font-size:18px; padding:4px;
  }
  .tabs{display:flex; gap:6px; background:var(--panel); border-radius:12px; padding:4px; margin-bottom:16px;}
  .tab{
    flex:1; text-align:center; padding:10px 6px; border-radius:9px; cursor:pointer;
    font-size:13px; font-weight:700; color:var(--text-soft);
  }
  .tab.active{background:var(--ball); color:#12280F;}
  table.standings{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.standings th{
    font-family:'JetBrains Mono'; font-size:10px; text-transform:uppercase; color:var(--text-soft);
    text-align:center; padding:6px 3px; border-bottom:1px solid rgba(255,255,255,0.12); font-weight:700;
  }
  table.standings th.left, table.standings td.left{text-align:left;}
  table.standings td{padding:9px 3px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.05);}
  table.standings tr:first-child td{background:rgba(207,230,74,0.06);}
  table.standings .rank{color:var(--ball); font-family:'JetBrains Mono'; font-weight:700;}
  table.standings .pts{font-family:'JetBrains Mono'; font-weight:700; color:var(--ball);}
  .match-card{background:var(--panel); border-radius:var(--radius); padding:14px; border:1px solid rgba(255,255,255,0.06);}
  .match-teams{display:flex; align-items:center; gap:10px;}
  .match-team{flex:1; font-weight:700; font-size:14.5px; line-height:1.25;}
  .match-team.win{color:var(--ball);}
  .vs-net{
    width:22px;height:22px;border-radius:50%; background:var(--ink); border:1px solid rgba(255,255,255,0.15);
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono'; font-size:10px; color:var(--text-soft); flex-shrink:0;
  }
  .set-scores{display:flex; gap:6px; margin-top:10px;}
  .set-chip{
    font-family:'JetBrains Mono'; background:var(--ink); border:1px solid rgba(255,255,255,0.1);
    border-radius:8px; padding:5px 8px; font-size:12.5px; font-weight:700;
  }
  .match-status-row{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .status-text{font-size:11.5px; color:var(--text-soft);}
  .modal-overlay{
    position:fixed; inset:0; background:rgba(4,12,10,0.72); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--panel); width:100%; max-width:480px; border-radius:20px 20px 0 0;
    padding:22px 18px 26px 18px; max-height:88vh; overflow-y:auto;
  }
  .modal-handle{width:40px; height:4px; background:rgba(255,255,255,0.15); border-radius:10px; margin:0 auto 16px auto;}
  .modal h2{font-family:'Bebas Neue'; font-size:24px; margin:0 0 4px 0; letter-spacing:0.4px;}
  .modal .modal-sub{font-size:12.5px; color:var(--text-soft); margin-bottom:16px;}
  .toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0; font-size:12.5px; color:var(--text-soft);}
  .switch{width:40px; height:22px; border-radius:100px; background:rgba(255,255,255,0.15); position:relative; cursor:pointer; flex-shrink:0;}
  .switch.on{background:var(--ball);}
  .switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on .knob{left:20px; background:#12280F;}

  /* ---- Court score entry ---- */
  .court-wrap{background:var(--panel); border-radius:16px; padding:12px; border:1px solid rgba(255,255,255,0.07);}
  .court{
    position:relative; aspect-ratio:10/15;
    background:linear-gradient(180deg, var(--pcourt-3) 0%, var(--pcourt) 50%, var(--pcourt-3) 100%);
    border-radius:10px; border:3px solid var(--paper); overflow:hidden;
    box-shadow:inset 0 0 40px rgba(0,0,0,0.35);
  }
  .court::before{ content:""; position:absolute; inset:6%; border:2px solid rgba(244,242,233,0.85); border-radius:2px; }
  .court .net{ position:absolute; left:0; right:0; top:50%; height:0; transform:translateY(-50%); border-top:5px dashed rgba(244,242,233,0.95); z-index:5; }
  .court .service-line{ position:absolute; left:6%; right:6%; height:0; border-top:2px solid rgba(244,242,233,0.85); }
  .court .service-line.top{ top:28%; }
  .court .service-line.bottom{ bottom:28%; }
  .court .center-line{ position:absolute; top:6%; bottom:6%; left:50%; width:0; border-left:2px solid rgba(244,242,233,0.55); }
  .court .center-line.top-half{ bottom:50%; top:28%; }
  .court .center-line.bottom-half{ top:50%; bottom:28%; }
  .court-half{
    position:absolute; left:0; right:0; height:50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; z-index:10; transition:background 0.2s;
  }
  .court-half.top{ top:0; }
  .court-half.bottom{ bottom:0; }
  .court-half.leading{ background:rgba(207,230,74,0.10); }
  .court-team-tag{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.4px; text-align:center;
    color:var(--paper); background:rgba(10,33,29,0.55); padding:4px 12px; border-radius:100px;
    max-width:85%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; backdrop-filter:blur(2px);
  }
  .court-score-num{
    font-family:'JetBrains Mono'; font-weight:700; font-size:52px; line-height:1;
    color:var(--paper); text-shadow:0 2px 10px rgba(0,0,0,0.4); min-width:70px; text-align:center;
  }
  .court-half.leading .court-score-num{ color:var(--ball); }
  .court-stepper{ display:flex; align-items:center; gap:12px; }
  .court-step-btn{
    width:40px; height:40px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(10,33,29,0.55); color:var(--paper); font-size:20px; font-weight:700;
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(2px);
  }
  .court-step-btn:active{ background:var(--ball); color:#12280F; transform:scale(0.94); }
  .court-tiebreak-badge{
    position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:20;
    background:var(--coral); color:#2A0D04; font-family:'JetBrains Mono'; font-weight:700;
    font-size:10px; letter-spacing:0.6px; padding:3px 10px; border-radius:100px;
  }
  .court-status-row{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; font-size:12.5px; color:var(--text-soft); }
  .court-status-row .winner{ color:var(--ball); font-weight:700; }

  .code-display{
    text-align:center; font-family:'JetBrains Mono'; font-size:32px; font-weight:700;
    letter-spacing:8px; color:var(--ball); background:var(--ink); border-radius:14px;
    padding:18px 10px; margin:14px 0; border:1px dashed rgba(207,230,74,0.4);
  }
  #qrbox{display:flex; justify-content:center; padding:14px; background:#fff; border-radius:14px; margin-bottom:14px;}
  .banner-error{background:rgba(228,87,46,0.14); border:1px solid rgba(228,87,46,0.4); color:#F5AC8F; padding:10px 12px; border-radius:10px; font-size:13px;}
  .banner-info{background:rgba(207,230,74,0.1); border:1px solid rgba(207,230,74,0.3); color:var(--ball); padding:10px 12px; border-radius:10px; font-size:12.5px;}
  .section-title{font-family:'Bebas Neue'; font-size:19px; letter-spacing:0.4px; margin:22px 0 10px 0; color:var(--paper);}
  .section-title:first-child{margin-top:0;}
  .fab-add{
    position:sticky; bottom:14px; margin-top:8px;
  }
  .live-dot{width:7px;height:7px;border-radius:50%; background:#4CD97B; display:inline-block; animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(76,217,123,0.5);}70%{box-shadow:0 0 0 6px rgba(76,217,123,0);}100%{box-shadow:0 0 0 0 rgba(76,217,123,0);}}
  .radio-team{
    display:flex; align-items:center; gap:12px; padding:14px; background:var(--ink);
    border-radius:12px; border:1px solid rgba(255,255,255,0.1); cursor:pointer; margin-bottom:8px;
  }
  .radio-team:active{background:var(--panel-2);}
  .radio-team.pick-selected{border-color:var(--ball); background:var(--panel-2);}
  .pick-check{
    width:24px; height:24px; border-radius:50%; border:1px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center; color:var(--ball); font-weight:700;
    flex-shrink:0; margin-left:auto;
  }
  .spinner{width:20px;height:20px;border-radius:50%;border:2.5px solid rgba(255,255,255,0.15);border-top-color:var(--ball);animation:spin 0.7s linear infinite; margin:40px auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .leg-badge{font-family:'Bebas Neue'; font-size:17px; letter-spacing:0.4px; color:var(--ball); margin:22px 0 8px 2px;}
  .leg-badge:first-child{margin-top:0;}
  .round-label{font-family:'JetBrains Mono'; font-size:10.5px; text-transform:uppercase; letter-spacing:0.6px; color:var(--text-soft); margin:14px 0 6px 4px; font-weight:700; display:flex; align-items:center; gap:6px;}
  .round-label::before{content:""; width:14px; height:1px; background:rgba(255,255,255,0.2);}
  .bye-badge{background:rgba(255,255,255,0.08); color:var(--text-soft); font-size:11px; font-weight:700; padding:4px 10px; border-radius:100px;}
  .champion-banner{
    background:linear-gradient(135deg, var(--ball), #EAF59B); color:#12280F;
    border-radius:var(--radius); padding:18px; text-align:center;
    font-family:'Bebas Neue'; font-size:21px; letter-spacing:0.4px; margin-bottom:18px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  // ---------- Storage helpers ----------
  // Three possible backends, tried in this order for "shared" (cross-device) data:
  //  1. window.storage  — only exists inside a Claude.ai artifact.
  //  2. Firebase Firestore — used once firebase-config.js has real project keys.
  //  3. localStorage — always available, but per-device only (no cross-device sync).
  // Personal data (identity, "my tournaments" list) always stays in localStorage/window.storage,
  // it's meant to be per-device.
  const NATIVE_STORAGE = (typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function");

  let db = null;
  const FIREBASE_CONFIGURED = (
    typeof window.__FIREBASE_CONFIG__ !== "undefined" &&
    window.__FIREBASE_CONFIG__ &&
    window.__FIREBASE_CONFIG__.apiKey &&
    window.__FIREBASE_CONFIG__.apiKey !== "REPLACE_ME" &&
    typeof firebase !== "undefined"
  );
  if(FIREBASE_CONFIGURED){
    try{
      firebase.initializeApp(window.__FIREBASE_CONFIG__);
      db = firebase.firestore();
    }catch(e){ console.error("Firebase init failed", e); db = null; }
  }

  window.__PADEL_SYNCED__ = NATIVE_STORAGE || !!db;

  async function sGet(key, shared){
    if(shared && db){
      try{
        const snap = await db.collection("padel_kv").doc(key).get();
        return snap.exists ? snap.data().value : null;
      }catch(e){ console.error("firestore get failed", e); return null; }
    }
    if(NATIVE_STORAGE){
      try{
        const r = await window.storage.get(key, !!shared);
        return r ? JSON.parse(r.value) : null;
      }catch(e){ return null; }
    }
    try{
      const raw = localStorage.getItem((shared?"shared:":"local:")+key);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  async function sSet(key, value, shared){
    if(shared && db){
      try{
        await db.collection("padel_kv").doc(key).set({ value, updatedAt: Date.now() });
        return true;
      }catch(e){ console.error("firestore set failed", e); return false; }
    }
    if(NATIVE_STORAGE){
      try{
        await window.storage.set(key, JSON.stringify(value), !!shared);
        return true;
      }catch(e){ console.error("storage set failed", e); return false; }
    }
    try{
      localStorage.setItem((shared?"shared:":"local:")+key, JSON.stringify(value));
      return true;
    }catch(e){ console.error("storage set failed", e); return false; }
  }
  async function sDelete(key, shared){
    if(shared && db){
      try{ await db.collection("padel_kv").doc(key).delete(); return true; }
      catch(e){ console.error("firestore delete failed", e); return false; }
    }
    if(NATIVE_STORAGE){
      try{ await window.storage.delete(key, !!shared); return true; }
      catch(e){ return false; }
    }
    try{ localStorage.removeItem((shared?"shared:":"local:")+key); return true; }
    catch(e){ return false; }
  }

  function uid(p){ return p + "-" + Math.random().toString(36).slice(2,9); }
  function genCode(){
    const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    let c = "";
    for(let i=0;i<6;i++) c += chars[Math.floor(Math.random()*chars.length)];
    return c;
  }
  function esc(s){
    return String(s==null?"":s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  }
  function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]] = [arr[j],arr[i]];
    }
    return arr;
  }

  // ---------- App state ----------
  const state = {
    view: "loading",
    identity: null,
    myTournaments: [],
    current: null,
    currentCode: null,
    tab: "table",
    modal: null,
    modalData: {},
    draft: null,
    joinCode: "",
    joinError: "",

  // ---------- Domain logic: scoring primitives ----------
  // Ein Satz entscheidet das Match: bis "target" Spiele (2 Spiele Vorsprung),
  // bei target:target Tiebreak bis target+1.
  function setWinner(a,b,target){
    target = target || 6;
    if(a===b || a==null || b==null || isNaN(a) || isNaN(b)) return null;
    const hi = Math.max(a,b), lo = Math.min(a,b);
    if(hi===target && hi-lo>=2) return a>b ? "A":"B";
    if(hi===target+1 && (lo===target-1 || lo===target)) return a>b ? "A":"B";
    return null;
  }

  // Shape-agnostic: works for team matches, pair (individual) matches and KO matches.
  // match.sets hält genau einen Eintrag {a,b} (oder ist leer, solange noch nicht gespielt).
  // match.forced=true bedeutet: manuell vorzeitig beendet (z. B. 4:3), Gewinner = höhere Zahl.
  // match.confirmed=true bedeutet: explizit über "Ergebnis speichern" bestätigt — erst dann gilt
  // das Match offiziell als beendet (Tabelle, K.-o.-Aufstieg, Turniersieger). Der laufende
  // Zwischenstand (jeder Tastendruck) wird zwar live gespeichert und angezeigt, zählt aber nicht
  // automatisch als Ergebnis, nur weil die Zahlen zufällig schon eine Siegbedingung erfüllen.
  // Ältere Matches ohne dieses Feld gelten weiterhin als bestätigt (Rückwärtskompatibilität).
  function evaluateMatch(match, target){
    const s = (match.sets && match.sets[0]) || null;
    if(!s) return { winsA:0, winsB:0, winnerSide:null, completed:false };
    let w;
    if(match.forced){
      w = s.a===s.b ? null : (s.a>s.b ? "A" : "B");
    } else {
      w = setWinner(s.a, s.b, target);
    }
    const confirmed = !!match.forced || match.confirmed !== false;
    const winnerSide = confirmed ? w : null;
    const winsA = winnerSide==="A" ? 1 : 0;
    const winsB = winnerSide==="B" ? 1 : 0;
    return { winsA, winsB, winnerSide, completed: !!winnerSide };
  }

  // ---------- Domain logic: Liga (feste Teams) ----------
  // Circle method: produces rounds where every team plays at most once per round
  // (so all matches in a round can run in parallel). Odd team counts get one bye per round.
  function circleMethodRounds(teams){
    let ids = teams.map(tm=>tm.id);
    if(ids.length % 2 !== 0) ids = ids.concat([null]);
    const n = ids.length;
    const fixed = ids[0];
    let rotating = ids.slice(1);
    const rounds = [];
    for(let r=0;r<n-1;r++){
      const arr = [fixed, ...rotating];
      const pairs = [];
      for(let i=0;i<n/2;i++){
        const a = arr[i], b = arr[n-1-i];
        if(a!=null && b!=null) pairs.push([a,b]);
      }
      rounds.push(pairs);
      rotating.unshift(rotating.pop());
    }
    return rounds;
  }

  // Turns circle-method rounds into a flat match list, splitting any round that has
  // more matches than available courts into extra sequential rounds.
  function buildLegMatches(teams, leg, courts){
    const c = Math.max(1, courts||1);
    const circleRounds = circleMethodRounds(teams);
    const matches = [];
    let roundCounter = 0;
    circleRounds.forEach(pairs=>{
      for(let i=0;i<pairs.length;i+=c){
        const chunk = pairs.slice(i, i+c);
        chunk.forEach(([a,b])=>{
          matches.push({ id: uid("m"), teamAId:a, teamBId:b, sets: [], leg: leg||"Hin", round: roundCounter });
        });
        roundCounter++;
      }
    });
    return matches;
  }

  function computeStandings(t){
    const rows = {};
    t.teams.forEach(team=>{
      rows[team.id] = { team, played:0, wins:0, losses:0, gamesW:0, gamesL:0, points:0 };
    });
    t.matches.forEach(m=>{
      const ev = evaluateMatch(m, t.setTarget);
      if(!ev.completed) return;
      const rA = rows[m.teamAId], rB = rows[m.teamBId];
      if(!rA || !rB) return;
      const s = m.sets[0];
      rA.played++; rB.played++;
      rA.gamesW += s.a; rA.gamesL += s.b;
      rB.gamesW += s.b; rB.gamesL += s.a;
      if(ev.winnerSide==="A"){ rA.wins++; rA.points+=2; rB.losses++; }
      else if(ev.winnerSide==="B"){ rB.wins++; rB.points+=2; rA.losses++; }
    });
    return Object.values(rows).sort((x,y)=>{
      if(y.points!==x.points) return y.points-x.points;
      const xg = x.gamesW-x.gamesL, yg = y.gamesW-y.gamesL;
      return yg-xg;
    });
  }

  // ---------- Domain logic: Liga (ohne feste Teams / Americano-Rotation) ----------
  function buildAmericanoCounts(players, existingRounds){
    const ids = players.map(p=>p.id);
    const partnerCount = {}, opponentCount = {}, sitOutCount = {};
    ids.forEach(a=>{
      partnerCount[a] = {}; opponentCount[a] = {}; sitOutCount[a] = 0;
      ids.forEach(b=>{ if(a!==b){ partnerCount[a][b]=0; opponentCount[a][b]=0; } });
    });
    (existingRounds||[]).forEach(rd=>{
      rd.matches.forEach(m=>{
        const [a1,a2]=m.pairA, [b1,b2]=m.pairB;
        if(partnerCount[a1]){ partnerCount[a1][a2] = (partnerCount[a1][a2]||0)+1; partnerCount[a2][a1] = (partnerCount[a2][a1]||0)+1; }
        if(partnerCount[b1]){ partnerCount[b1][b2] = (partnerCount[b1][b2]||0)+1; partnerCount[b2][b1] = (partnerCount[b2][b1]||0)+1; }
        m.pairA.forEach(x=> m.pairB.forEach(y=>{
          if(opponentCount[x]) opponentCount[x][y] = (opponentCount[x][y]||0)+1;
          if(opponentCount[y]) opponentCount[y][x] = (opponentCount[y][x]||0)+1;
        }));
      });
      (rd.sitOut||[]).forEach(id=>{ if(sitOutCount[id]!=null) sitOutCount[id]++; });
    });
    return { partnerCount, opponentCount, sitOutCount };
  }

  function generateAmericanoRounds(players, numRounds, startIndex, seed){
    const ids = players.map(p=>p.id);
    const n = ids.length;
    let partnerCount, opponentCount, sitOutCount;
    if(seed){
      partnerCount = seed.partnerCount; opponentCount = seed.opponentCount; sitOutCount = seed.sitOutCount;
    } else {
      partnerCount = {}; opponentCount = {}; sitOutCount = {};
      ids.forEach(a=>{
        partnerCount[a] = {}; opponentCount[a] = {}; sitOutCount[a] = 0;
        ids.forEach(b=>{ if(a!==b){ partnerCount[a][b]=0; opponentCount[a][b]=0; } });
      });
    }
    const restCount = n % 4;
    const rounds = [];
    const base = startIndex || 0;

    for(let r=0;r<numRounds;r++){
      let best = null, bestScore = Infinity;
      for(let attempt=0; attempt<120; attempt++){
        let sitting = [];
        if(restCount>0){
          const bySit = ids.slice().sort((a,b)=> sitOutCount[a]-sitOutCount[b] || (Math.random()-0.5));
          sitting = bySit.slice(0, restCount);
        }
        const playing = shuffleArray(ids.filter(id=>!sitting.includes(id)));
        const groups = [];
        for(let i=0;i<playing.length;i+=4) groups.push(playing.slice(i,i+4));

        let score = 0;
        const candidateMatches = [];
        let ok = true;
        groups.forEach(g=>{
          if(g.length<4){ ok = false; return; }
          const splits = [
            [[g[0],g[1]],[g[2],g[3]]],
            [[g[0],g[2]],[g[1],g[3]]],
            [[g[0],g[3]],[g[1],g[2]]]
          ];
          let bestSplit=null, bestSplitScore=Infinity;
          splits.forEach(([pa,pb])=>{
            let s = partnerCount[pa[0]][pa[1]] + partnerCount[pb[0]][pb[1]];
            pa.forEach(x=> pb.forEach(y=> s += opponentCount[x][y]));
            if(s<bestSplitScore){ bestSplitScore=s; bestSplit=[pa,pb]; }
          });
          score += bestSplitScore;
          candidateMatches.push({ pairA: bestSplit[0], pairB: bestSplit[1] });
        });
        if(!ok) continue;
        sitting.forEach(id=> score += sitOutCount[id]*0.01);
        if(score<bestScore){ bestScore=score; best = { sitting: sitting.slice(), matches: candidateMatches }; }
      }
      if(!best) best = { sitting: [], matches: [] };
      best.matches.forEach(m=>{
        const [a1,a2]=m.pairA, [b1,b2]=m.pairB;
        partnerCount[a1][a2]++; partnerCount[a2][a1]++;
        partnerCount[b1][b2]++; partnerCount[b2][b1]++;
        m.pairA.forEach(x=> m.pairB.forEach(y=>{ opponentCount[x][y]++; opponentCount[y][x]++; }));
      });
      best.sitting.forEach(id=> sitOutCount[id]++);
      rounds.push({
        index: base + r,
        sitOut: best.sitting,
        matches: best.matches.map(m=>({ id: uid("am"), pairA:m.pairA, pairB:m.pairB, sets:[] }))
      });
    }
    return rounds;
  }

  function computeIndividualStandings(t){
    const rows = {};
    t.players.forEach(p=>{ rows[p.id] = { player:p, played:0, wins:0, points:0 }; });
    (t.ligaRounds||[]).forEach(rd=>{
      rd.matches.forEach(m=>{
        const ev = evaluateMatch(m, t.setTarget);
        m.pairA.forEach(pid=>{ if(rows[pid]) rows[pid].played++; });
        m.pairB.forEach(pid=>{ if(rows[pid]) rows[pid].played++; });
        const s = m.sets[0];
        if(s && setWinner(s.a, s.b, t.setTarget)){
          m.pairA.forEach(pid=>{ if(rows[pid]) rows[pid].points += s.a; });
          m.pairB.forEach(pid=>{ if(rows[pid]) rows[pid].points += s.b; });
        }
        if(ev.winnerSide==="A") m.pairA.forEach(pid=>{ if(rows[pid]) rows[pid].wins++; });
        else if(ev.winnerSide==="B") m.pairB.forEach(pid=>{ if(rows[pid]) rows[pid].wins++; });
      });
    });
    return Object.values(rows).sort((x,y)=> y.points-x.points || y.wins-x.wins);
  }

  // ---------- Domain logic: K.-o.-System ----------
  function nextPow2(n){ let p=1; while(p<n) p*=2; return p; }

  function buildKOBracket(teams){
    // Distribute byes so each bye match holds exactly one real team —
    // never pair two byes together, which would create a dead slot with no winner.
    const n = teams.length;
    const size = nextPow2(n);
    const numMatches = size/2;
    const byeCount = size - n;
    const shuffledTeams = shuffleArray(teams.map(tm=>tm.id));
    const byeMatchIndices = new Set(shuffleArray([...Array(numMatches).keys()]).slice(0, byeCount));
    let cursor = 0;
    const matches = [];
    for(let i=0;i<numMatches;i++){
      let a, b;
      if(byeMatchIndices.has(i)){
        a = shuffledTeams[cursor++]; b = null;
      } else {
        a = shuffledTeams[cursor++]; b = shuffledTeams[cursor++];
      }
      const m = { id: uid("km"), roundIndex:0, slotIndex:i, teamAId:a, teamBId:b, sets:[], bye:false, winnerId:null, sourceA:null, sourceB:null };
      if(a==null || b==null){ m.bye = true; m.winnerId = a || b; }
      matches.push(m);
    }
    const totalRounds = Math.log2(size);
    for(let r=1;r<totalRounds;r++){
      const count = size/Math.pow(2,r+1);
      for(let i=0;i<count;i++){
        const srcA = matches.find(x=>x.roundIndex===r-1 && x.slotIndex===2*i);
        const srcB = matches.find(x=>x.roundIndex===r-1 && x.slotIndex===2*i+1);
        matches.push({ id: uid("km"), roundIndex:r, slotIndex:i, teamAId:null, teamBId:null, sets:[], bye:false, winnerId:null, sourceA:srcA.id, sourceB:srcB.id });
      }
    }
    return matches;
  }

  function koWinnerId(m, target){
    if(m.bye) return m.winnerId;
    const ev = evaluateMatch(m, target);
    if(ev.winnerSide==="A") return m.teamAId;
    if(ev.winnerSide==="B") return m.teamBId;
    return null;
  }
  function koCompleted(m, target){ return m.bye ? true : evaluateMatch(m, target).completed; }

  function propagateKO(t){
    const matches = t.matches;
    matches.sort((a,b)=> a.roundIndex-b.roundIndex || a.slotIndex-b.slotIndex);
    matches.forEach(m=>{
      if(m.roundIndex===0) return;
      const srcA = matches.find(x=>x.id===m.sourceA);
      const srcB = matches.find(x=>x.id===m.sourceB);
      m.teamAId = (srcA && koCompleted(srcA, t.setTarget)) ? koWinnerId(srcA, t.setTarget) : null;
      m.teamBId = (srcB && koCompleted(srcB, t.setTarget)) ? koWinnerId(srcB, t.setTarget) : null;
    });
    const maxRound = Math.max(...matches.map(m=>m.roundIndex));
    const final = matches.find(m=>m.roundIndex===maxRound);
    t.champion = (final && koCompleted(final, t.setTarget)) ? koWinnerId(final, t.setTarget) : null;
  }

  // Erzeugt den Spielplan (Matches/Runden) für ein bereits konfiguriertes Turnier
  // (teams/players/courts/rueckrunde/rounds sind schon gesetzt) und markiert es als gestartet.
  // Wird sowohl bei sofortiger Erstellung als auch beim späteren "Turnier starten" in Gruppen genutzt.
  function generateMatchesForTournament(t){
    if(t.type==="liga" && t.ligaMode==="teams"){
      const courts = t.courts || 1;
      let matches = buildLegMatches(t.teams, "Hin", courts);
      if(t.rueckrunde){
        matches = matches.concat(buildLegMatches(t.teams, "Rueck", courts).map(m=>({ ...m, teamAId:m.teamBId, teamBId:m.teamAId })));
      }
      t.matches = matches;
    } else if(t.type==="liga" && t.ligaMode==="individual"){
      t.ligaRounds = generateAmericanoRounds(t.players, t.rounds || 6);
    } else if(t.type==="ko"){
      t.matches = buildKOBracket(t.teams);
      propagateKO(t);
    }
    t.started = true;
  }

  function roundName(r, total){
    const fromEnd = total-1-r;
    if(fromEnd===0) return "Finale";
    if(fromEnd===1) return "Halbfinale";
    if(fromEnd===2) return "Viertelfinale";
    if(fromEnd===3) return "Achtelfinale";
    return "Runde " + (r+1);
  }

  // ---------- Name / permission helpers ----------
  function teamName(t, id){
    const team = (t.teams||[]).find(x=>x.id===id);
    return team ? team.name : "?";
  }
  function playerName(t, id){
    const p = (t.players||[]).find(x=>x.id===id);
    return p ? p.name : "?";
  }
  function sideLabel(t, match, side){
    if(match.pairA){
      const ids = side==="A" ? match.pairA : match.pairB;
      return ids.map(id=>playerName(t,id)).join(" & ");
    }
    const id = side==="A" ? match.teamAId : match.teamBId;
    if(id==null) return "TBD";
    return teamName(t, id);
  }

  function myMembership(t){
    if(!t || !state.identity) return null;
    return t.members.find(m=>m.userId===state.identity.id) || null;
  }
  function isOrganizer(t){
    return t && state.identity && t.organizerId === state.identity.id;
  }
  function canEditMatch(t, match){
    if(t.finished) return false;
    if(isOrganizer(t)) return true;
    const mem = myMembership(t);
    if(!mem) return false;
    if(mem.promoted) return true;
    if(!mem.teamId) return false;
    if(match.pairA) return match.pairA.includes(mem.teamId) || match.pairB.includes(mem.teamId);
    if(match.teamAId==null || match.teamBId==null) return false;
    return mem.teamId===match.teamAId || mem.teamId===match.teamBId;
  }

  function isMyMatch(t, match){
    const mem = myMembership(t);
    if(!mem || !mem.teamId) return false;
    if(match.pairA) return match.pairA.includes(mem.teamId) || match.pairB.includes(mem.teamId);
    if(match.teamAId==null || match.teamBId==null) return false;
    return mem.teamId===match.teamAId || mem.teamId===match.teamBId;
  }

  function entityList(t){
    if(t.type==="liga" && t.ligaMode==="individual"){
      return t.players.map(p=>({ id:p.id, name:p.name, sub:"" }));
    }
    return t.teams.map(tm=>({ id:tm.id, name:tm.name, sub:[tm.p1,tm.p2].filter(Boolean).join(" & ") }));
  }

  function normalizeTournament(t){
    if(!t) return t;
    if(!t.type) t.type = "liga";
    if(t.type==="liga" && !t.ligaMode) t.ligaMode = "teams";
    if(!t.teams) t.teams = [];
    if(!t.players) t.players = [];
    if(!t.matches) t.matches = [];
    if(!t.ligaRounds) t.ligaRounds = [];
    if(!t.setTarget) t.setTarget = 6;
    if(t.rueckrunde==null) t.rueckrunde = false;
    if(t.rueckrundeStartIndex===undefined) t.rueckrundeStartIndex = null;
    if(t.groupCode===undefined) t.groupCode = null;
    if(t.finished==null) t.finished = false;
    if(t.pointsAwarded==null) t.pointsAwarded = false;
    if(t.started==null) t.started = true; // ältere Turniere liefen schon immer sofort los
    if(!t.groupMemberRoster) t.groupMemberRoster = [];
    return t;
  }
  async function loadTournament(code){
    return normalizeTournament(await sGet("tournament:" + code, true));
  }
  async function saveTournament(t){
    t.updatedAt = Date.now();
    await sSet("tournament:" + t.code, t, true);
  }

  async function refreshMyTournamentsList(){
    const codes = await getMyCodes();
    const results = [];
    for(const code of codes){
      const t = await loadTournament(code);
      if(t) results.push(t);
    }
    results.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
    state.myTournaments = results;
  }

  function normalizeGroup(g){

  // ---------- Gruppen: Rollen & Punkte ----------
  function isGroupLeader(g){
    return g && state.identity && g.leaderId === state.identity.id;
  }
  function myGroupMembership(g){
    if(!g || !state.identity) return null;
    return g.members.find(m=>m.userId===state.identity.id) || null;
  }
  function isGroupAdmin(g){
    if(isGroupLeader(g)) return true;
    const mem = myGroupMembership(g);
    return !!(mem && mem.promoted);
  }

  // Platzhalter-Punktevergabe: Teams/Spieler:innen bekommen die gleichen Punkte,
  // die sie im Turnier selbst erzielt haben, gutgeschrieben auf ihr Gruppenkonto.
  // Die genaue Formel (Gewichtung nach Turniergröße etc.) klären wir später.
  function creditGroupPoints(g, t){
    g.pointsTable = g.pointsTable || {};
    const add = (userId, pts)=>{
      if(!userId) return;
      g.pointsTable[userId] = (g.pointsTable[userId]||0) + pts;
    };
    if(t.type==="liga" && t.ligaMode==="individual"){
      computeIndividualStandings(t).forEach(r=> add(r.player.id, r.points));
    } else if(t.type==="liga" && t.ligaMode==="teams"){
      computeStandings(t).forEach(r=> (r.team.memberUserIds||[]).forEach(uid=> add(uid, r.points)));
    } else if(t.type==="ko"){
      t.teams.forEach(team=>{
        let wins = 0;
        t.matches.forEach(m=>{
          if(m.teamAId!==team.id && m.teamBId!==team.id) return;
          const ev = evaluateMatch(m, t.setTarget);
          if((ev.winnerSide==="A" && m.teamAId===team.id) || (ev.winnerSide==="B" && m.teamBId===team.id)) wins++;
        });
        (team.memberUserIds||[]).forEach(uid=> add(uid, wins*2));
      });
    }
  }

  // ---------- Navigation ----------
  function stopPolling(){
    if(state.pollHandle){ clearInterval(state.pollHandle); state.pollHandle = null; }
  }
  function startPolling(){
    stopPolling();
    state.pollHandle = setInterval(async ()=>{
      if(state.view==="detail" && state.currentCode){
        const code = state.currentCode;
        const fresh = await loadTournament(code);
        if(!fresh){
          if(state.currentCode===code){
            state.homeNotice = `Das Turnier „${state.current ? state.current.name : ""}" ist nicht mehr verfügbar (wahrscheinlich gelöscht).`;
            await removeMyCode(code);
            return goHome();
          }
          return;
        }
        if(JSON.stringify(fresh)!==JSON.stringify(state.current)){
          state.current = fresh;
          if(!state.modal){
            render();
          } else if(state.modal==="score"){
            const m = findModalMatch();
            if(m){
              const s = m.sets[0];
              state.modalData.a = s ? s.a : (state.modalData.a||0);
              state.modalData.b = s ? s.b : (state.modalData.b||0);
              render();
            }
          }
        }
        return;
      }
      if(state.view==="groupDetail" && state.currentGroupCode){
        const code = state.currentGroupCode;
        const fresh = await loadGroup(code);
        if(!fresh){
          if(state.currentGroupCode===code){
            state.homeNotice = `Die Gruppe „${state.currentGroup ? state.currentGroup.name : ""}" ist nicht mehr verfügbar (wahrscheinlich gelöscht).`;
            await removeMyGroupCode(code);
            return goHome();
          }
          return;
        }
        if(JSON.stringify(fresh)!==JSON.stringify(state.currentGroup)){
          state.currentGroup = fresh;
          await refreshGroupTournaments(fresh);
          if(!state.modal) render();
        }
      }
    }, 3500);
  }

  async function goHome(){
    stopPolling();
    state.view = "home"; state.modal=null; state.current=null; state.currentCode=null;
    state.currentGroup=null; state.currentGroupCode=null;
    await refreshMyTournamentsList();
    await refreshMyGroupsList();
    render();
  }

  async function refreshGroupTournaments(g){
    const results = [];
    let staleFound = false;
    const validCodes = [];
    for(const code of (g.tournamentCodes||[])){
      const t = await loadTournament(code);
      if(t){ results.push(t); validCodes.push(code); }
      else { staleFound = true; }
    }
    results.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));
    state.currentGroupTournaments = results;
    if(staleFound){
      g.tournamentCodes = validCodes;
      await saveGroup(g);
    }
  }

  async function openGroupDetail(code){
    const g = await loadGroup(code);
    if(!g){ return goHome(); }
    state.currentGroup = g; state.currentGroupCode = code; state.view = "groupDetail"; state.modal = null;
    await refreshGroupTournaments(g);
    startPolling();
    render();
  }

  async function openDetail(code){
    const t = await loadTournament(code);
    if(!t){ return goHome(); }
    state.current = t; state.currentCode = code; state.view = "detail"; state.tab = "table"; state.modal=null;
    state.teamPickSelection = [];
    startPolling();
    render();
  }

  async function attemptJoin(code){
    const t = await loadTournament(code);
    if(!t) return { ok:false };
    let mem = t.members.find(m=>m.userId===state.identity.id);
    if(!mem){
      mem = { userId: state.identity.id, name: state.identity.name, teamId: null };
      t.members.push(mem);
      await saveTournament(t);
    }
    await addMyCode(code);
    return { ok:true, t, mem };
  }

  async function enterJoinedTournament(t, mem, code){
    const entities = entityList(t);
    if(!mem.teamId && entities.length){
      state.modal = "jointeam";
      state.modalData = { tournament: t };
      state.current = t; state.currentCode = code;
      state.view = "detail"; state.tab="table";
      startPolling();
      return render();
    }
    return openDetail(code);
  }

  async function tryAutoJoinFromUrl(){
    const code = state.pendingJoinCode;
    if(!code) return;
    state.pendingJoinCode = null;
    const res = await attemptJoin(code);
    if(!res.ok){
      state.homeNotice = `Kein Turnier mit dem Code „${code}" gefunden — evtl. wurde es gelöscht.`;
      return render();
    }
    return enterJoinedTournament(res.t, res.mem, code);
  }

  async function attemptJoinGroup(code){
    const g = await loadGroup(code);
    if(!g) return { ok:false };
    let mem = g.members.find(m=>m.userId===state.identity.id);
    if(!mem){
      mem = { userId: state.identity.id, name: state.identity.name, promoted:false };
      g.members.push(mem);
      await saveGroup(g);
    }
    await addMyGroupCode(code);
    return { ok:true, g };
  }

  async function tryAutoJoinGroupFromUrl(){
    const code = state.pendingGroupJoinCode;
    if(!code) return;
    state.pendingGroupJoinCode = null;
    const res = await attemptJoinGroup(code);
    if(!res.ok){
      state.homeNotice = `Keine Gruppe mit dem Code „${code}" gefunden — evtl. wurde sie gelöscht.`;
      return render();
    }
    return openGroupDetail(code);
  }

  // ---------- Render: shell ----------
  function render(){
    app.innerHTML = "";
    let content = "";
    if(state.view==="loading") content = viewLoading();
    else if(state.view==="onboarding") content = viewOnboarding();
    else if(state.view==="home") content = viewHome();
    else if(state.view==="create") content = viewCreate();
    else if(state.view==="createTeams") content = viewCreateTeams();
    else if(state.view==="join") content = viewJoin();
    else if(state.view==="detail") content = viewDetail();
    else if(state.view==="createGroup") content = viewCreateGroup();
    else if(state.view==="joinGroup") content = viewJoinGroup();
    else if(state.view==="groupDetail") content = viewGroupDetail();
    app.innerHTML = content + (state.modal ? renderModal() : "");
    attachHandlers();
  }

        ${state.groupJoinError ? `<div class="banner-error">${esc(state.groupJoinError)}</div>` : ""}
        <button class="btn btn-primary" data-action="submitJoinGroup" ${state.groupJoinLoading?"disabled":""}>${state.groupJoinLoading?"Beitreten …":"Beitreten"}</button>
      </div>
    </div>`;
  }

  function groupPointsTable(g){
    const rows = g.members.map(mem=>({ mem, points: (g.pointsTable && g.pointsTable[mem.userId]) || 0 }))
      .sort((a,b)=> b.points-a.points);

    <table class="standings">
      <thead><tr><th class="left">Mitglied</th><th>Punkte</th></tr></thead>
      <tbody>
        ${rows.map((r,i)=>`

            <td class="left"><span class="rank">${i+1}</span>&nbsp; ${esc(r.mem.name)}${r.mem.userId===g.leaderId?" 👑":""}</td>

  function viewGroupDetail(){
    const g = state.currentGroup;
    const admin = isGroupAdmin(g);
    const mem = myGroupMembership(g);
    const roleLabel = isGroupLeader(g) ? "Gruppenleiter" : (mem && mem.promoted ? "Co-Leiter" : "Mitglied");

    const gTournaments = state.currentGroupTournaments || [];
    const tournCards = gTournaments.length ? `<div class="stack">${gTournaments.map(t=>{
      const countLabel = (t.type==="liga" && t.ligaMode==="individual") ? `${t.players.length} Spieler:innen` : `${t.teams.length} Teams`;
      const typeLabel = t.type==="ko" ? "K.-o.-System" : (t.ligaMode==="individual" ? "Liga · ohne feste Teams" : "Liga");
      const statusLabel = t.finished ? "Beendet" : (t.started ? "Läuft" : "Wird gebildet");

        <div class="meta">
          <span class="pill">${esc(typeLabel)}</span>
          <span class="pill muted">${esc(countLabel)}</span>
          <span class="pill muted">${esc(statusLabel)}</span>
        </div>
      </div>`;
    }).join("")}</div>` : `<div class="empty">Noch keine Turniere in dieser Gruppe.</div>`;

    return `
    <div class="topbar">
      <div class="back-btn" data-action="goHome">←</div>
      <div>
        <h1>👥 ${esc(g.name)}</h1>
        <div class="sub"><span data-action="openGroupMembers" style="cursor:pointer;">${esc(roleLabel)} · <span class="live-dot"></span> ${g.members.length} Mitglieder</span></div>

      <button class="icon-btn" style="font-size:22px;" data-action="openGroupInvite" title="Einladen">＋👤</button>
    </div>
    <div class="screen" style="padding-top:6px;">
      <div class="section-title">Gesamttabelle</div>
      <div class="banner-info" style="margin-bottom:14px;">Punkte aus allen beendeten Turnieren dieser Gruppe. Die genaue Gewichtung feilen wir später noch aus.</div>
      ${groupPointsTable(g)}

      <div class="section-title">Turniere in dieser Gruppe</div>
      ${tournCards}
      ${admin ? `<button class="btn btn-primary" style="margin-top:14px;" data-action="goCreateInGroup">+ Neues Turnier in dieser Gruppe</button>` : `<div class="banner-info" style="margin-top:14px;">Nur der Gruppenleiter kann neue Turniere anlegen.</div>`}

      <button class="btn btn-danger" style="margin-top:26px;" data-action="deleteGroup">${isGroupLeader(g) ? "🗑 Gruppe löschen" : "Gruppe verlassen"}</button>
    </div>`;
  }

  // ---------- Detail ----------
  function matchCardHtml(t, m, roundIndex){
    const ev = evaluateMatch(m, t.setTarget);
    const editable = canEditMatch(t, m);
    const nameA = sideLabel(t, m, "A");
    const nameB = sideLabel(t, m, "B");
    const pending = !m.pairA && !m.bye && (m.teamAId==null || m.teamBId==null);
    let winA, winB;
    if(m.bye){ winA = !!m.teamAId; winB = !!m.teamBId; }
    else { winA = ev.winnerSide==="A"; winB = ev.winnerSide==="B"; }

    const setsHtml = m.sets.length ? `<div class="set-scores"><span class="set-chip">${m.sets[0].a}:${m.sets[0].b}</span></div>` : "";
    const roundAttr = roundIndex!=null ? ` data-round="${roundIndex}"` : "";

    let actionHtml;
    const viewable = !m.bye && !pending; // spectators can open these to see the live score
    if(m.bye){
      actionHtml = `<span class="bye-badge">Freilos</span>`;
    } else if(pending){
      actionHtml = `<span class="status-text">Wartet auf vorherige Runde</span>`;
    } else if(editable){
      actionHtml = `<button class="btn btn-secondary btn-sm" data-action="openScore" data-match="${m.id}"${roundAttr}>${m.sets.length ? "Ergebnis bearbeiten" : "Ergebnis eintragen"}</button>`;
    } else {
      actionHtml = `<span class="status-text">${m.sets.length ? "Antippen für Live-Stand" : "Noch nicht begonnen"}</span>`;
    }

    let statusText;
    if(m.bye) statusText = esc((winA?nameA:nameB)) + " kommt kampflos weiter";
    else if(pending) statusText = "Ausstehend";
    else if(ev.completed) statusText = m.forced ? "Beendet (manuell)" : "Beendet";
    else statusText = m.sets.length ? "Läuft" : "Ausstehend";

    const cardClickAttr = (viewable && !editable) ? ` data-action="openScore" data-match="${m.id}"${roundAttr} style="cursor:pointer;"` : "";

    return `
    <div class="match-card"${cardClickAttr} style="margin-bottom:12px;">
      <div class="match-teams">
        <div class="match-team ${winA?'win':''}">${esc(nameA)}</div>
        <div class="vs-net">VS</div>
        <div class="match-team ${winB?'win':''}" style="text-align:right;">${esc(nameB)}</div>
      </div>
      ${setsHtml}
      <div class="match-status-row">
        <span class="status-text">${statusText}</span>
        ${actionHtml}
      </div>
    </div>`;
  }

  function renderTeamStandings(t){
    const standings = computeStandings(t);
    return `
    <table class="standings">
      <thead><tr>
        <th class="left">Team</th><th>Sp</th><th>S</th><th>N</th><th>Spiele</th><th>Pkt</th>
      </tr></thead>
      <tbody>
        ${standings.map((r,i)=>`
          <tr>
            <td class="left" data-action="openTeamMatches" data-team="${esc(r.team.id)}" style="cursor:pointer;"><span class="rank">${i+1}</span>&nbsp; ${esc(r.team.name)}</td>
            <td>${r.played}</td>
            <td>${r.wins}</td>
            <td>${r.losses}</td>
            <td class="mono">${r.gamesW}:${r.gamesL}</td>
            <td class="pts">${r.points}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  }

  function matchFilterToggle(){
    return `
    <div class="tabs" style="margin-bottom:14px;">
      <div class="tab ${state.matchFilter!=='mine'?'active':''}" data-action="setMatchFilter" data-filter="all">Alle Spiele</div>
      <div class="tab ${state.matchFilter==='mine'?'active':''}" data-action="setMatchFilter" data-filter="mine">Meine Spiele</div>
    </div>`;
  }

  function renderRoundGroupedMatches(t, matches){
    if(!matches.length) return `<div class="empty">Keine Spiele.</div>`;
    const roundNums = [...new Set(matches.map(m=>m.round))].sort((a,b)=>a-b);
    return roundNums.map(rn=>{
      const roundMatches = matches.filter(m=>m.round===rn);
      return `<div class="round-label">Runde ${rn+1}</div>${roundMatches.map(m=>matchCardHtml(t,m,null)).join("")}`;
    }).join("");
  }

  function renderTeamMatches(t){
    const courts = t.courts || 1;
    const mine = state.matchFilter==="mine";
    const pool = mine ? t.matches.filter(m=>isMyMatch(t,m)) : t.matches;
    let html = `<div class="banner-info" style="margin-bottom:14px;">🏟 ${courts} Court${courts>1?'s':''} — bis zu ${courts} Spiel${courts>1?'e':''} pro Runde parallel.</div>`;
    html += matchFilterToggle();
    if(mine && !myMembership(t)?.teamId){
      html += `<div class="empty">Du bist keinem Team zugeordnet.</div>`;
    } else if(t.rueckrunde){
      const hin = pool.filter(m=>m.leg!=="Rueck");
      const rueck = pool.filter(m=>m.leg==="Rueck");
      html += `<div class="leg-badge">Hinrunde</div>${renderRoundGroupedMatches(t, hin)}<div class="leg-badge">Rückrunde</div>${renderRoundGroupedMatches(t, rueck)}`;
    } else {
      html += renderRoundGroupedMatches(t, pool);
    }
    if(!mine && !t.rueckrunde && isOrganizer(t)){
      html += `<button class="btn btn-secondary" style="margin-top:18px;" data-action="startRueckrunde">Rückrunde starten</button>`;
    }
    return html;
  }

  function renderIndividualStandings(t){
    const rows = computeIndividualStandings(t);
    return `
    <table class="standings">
      <thead><tr><th class="left">Spieler:in</th><th>Runden</th><th>Siege</th><th>Pkt</th></tr></thead>
      <tbody>
        ${rows.map((r,i)=>`
          <tr>
            <td class="left"><span class="rank">${i+1}</span>&nbsp; ${esc(r.player.name)}</td>
            <td>${r.played}</td>
            <td>${r.wins}</td>
            <td class="pts">${r.points}</td>
          </tr>`).join("")}
      </tbody>
    </table>`;
  }

  function renderIndividualRounds(t){
    const mine = state.matchFilter==="mine";
    let html = matchFilterToggle();
    if(mine && !myMembership(t)?.teamId){
      return html + `<div class="empty">Du bist keinem Spieler zugeordnet.</div>`;
    }
    if(!t.ligaRounds.length) return html + `<div class="empty">Keine Runden.</div>`;
    const rueckStart = t.rueckrundeStartIndex;
    let any = false;
    t.ligaRounds.forEach(rd=>{
      const matches = mine ? rd.matches.filter(m=>isMyMatch(t,m)) : rd.matches;
      if(mine && !matches.length) return;
      any = true;
      if(rueckStart!=null && rd.index===rueckStart){ html += `<div class="leg-badge">Rückrunde</div>`; }
      const sitNames = rd.sitOut.map(pid=>playerName(t,pid)).join(", ");
      const matchesHtml = matches.map(m=>matchCardHtml(t,m,rd.index)).join("");
      html += `<div class="leg-badge">Runde ${rd.index+1}${rd.sitOut.length ? " · Pause: "+esc(sitNames) : ""}</div>${matchesHtml}`;
    });
    if(!any) html += `<div class="empty">Keine eigenen Spiele.</div>`;
    if(!mine && !t.rueckrunde && isOrganizer(t)){
      html += `<button class="btn btn-secondary" style="margin-top:18px;" data-action="startRueckrunde">Rückrunde starten (weitere Runden auslosen)</button>`;
    }
    return html;
  }

  function renderKOBracket(t){
    if(!t.matches.length) return `<div class="empty">Kein Turnierbaum.</div>`;
    const mine = state.matchFilter==="mine";
    const maxRound = Math.max(...t.matches.map(m=>m.roundIndex));
    const totalRounds = maxRound+1;
    let html = matchFilterToggle();
    if(t.champion){
      html += `<div class="champion-banner">🏆 Turniersieger: ${esc(teamName(t,t.champion))}</div>`;
    }
    if(mine && !myMembership(t)?.teamId){
      return html + `<div class="empty">Du bist keinem Team zugeordnet.</div>`;
    }
    let any = false;
    for(let r=0;r<=maxRound;r++){
      let matches = t.matches.filter(m=>m.roundIndex===r).sort((a,b)=>a.slotIndex-b.slotIndex);
      if(mine) matches = matches.filter(m=>isMyMatch(t,m));
      if(mine && !matches.length) continue;
      any = true;
      html += `<div class="leg-badge">${esc(roundName(r,totalRounds))}</div>`;
      html += matches.map(m=>matchCardHtml(t,m,null)).join("");
    }
    if(mine && !any) html += `<div class="empty">Keine eigenen Spiele (evtl. schon ausgeschieden).</div>`;
    return html;
  }

  function canFormTeams(t){
    if(isOrganizer(t)) return true;
    return (t.groupMemberRoster||[]).some(m=>m.userId===state.identity.id);
  }
  function canRemoveLiveTeam(t, team){
    if(isOrganizer(t)) return true;
    return (team.memberUserIds||[]).includes(state.identity.id);
  }

  function renderFormingState(t){
    const org = isOrganizer(t);
    const isIndividual = t.type==="liga" && t.ligaMode==="individual";
    let html = `<div class="banner-info" style="margin-bottom:14px;">Das Turnier wird gerade vorbereitet. Sobald ${org ? "du auf \"Turnier starten\" tippst" : "der Turnierleiter startet"}, wird der Spielplan erstellt.</div>`;
    if(isIndividual){
      html += `<div class="section-title">Teilnehmer:innen</div>`;
      html += t.players.map((p,i)=>`
        <div class="team-row"><div class="team-avatar">${i+1}</div><div class="t-info"><div class="t-name">${esc(p.name)}</div></div></div>`).join("");
    } else {
      const min = t.type==="ko" ? 2 : 3;
      html += `<div class="section-title">Teams (${t.teams.length}${t.teams.length<min?` · mind. ${min} nötig`:''})</div>`;
      html += t.teams.length ? t.teams.map((team,i)=>{
        const removable = canRemoveLiveTeam(t, team);
        return `
        <div class="team-row">
          <div class="team-avatar">${i+1}</div>
          <div class="t-info"><div class="t-name">${esc(team.name)}</div><div class="t-players">${[team.p1,team.p2].filter(Boolean).map(esc).join(" & ")}</div></div>
          ${removable ? `<button class="icon-btn" data-action="openEditTeamName" data-team="${esc(team.id)}" title="Umbenennen">✏️</button>` : ""}
          ${removable ? `<button class="icon-btn" data-action="removeLiveTeam" data-team="${esc(team.id)}" title="Auflösen">✕</button>` : ""}
        </div>`;
      }).join("") : `<div class="empty">Noch keine Teams gebildet.</div>`;

      if(canFormTeams(t)){
        const assignedIds = new Set(t.teams.flatMap(tm=>tm.memberUserIds||[]));
        const available = (t.groupMemberRoster||[]).filter(m=>!assignedIds.has(m.userId));
        const pickRows = available.map(m=>{
          const picked = state.teamPickSelection.includes(m.userId);
          return `
          <div class="radio-team ${picked?'pick-selected':''}" data-action="toggleTeamPick" data-user="${esc(m.userId)}">
            <div class="team-avatar">${esc((m.name[0]||"?").toUpperCase())}</div>
            <div class="t-info"><div class="t-name">${esc(m.name)}</div></div>
            <div class="pick-check">${picked?"✓":""}</div>
          </div>`;
        }).join("");

        html += `<div class="section-title">Team bilden</div>`;
        html += available.length ? pickRows : `<div class="empty">Alle Gruppenmitglieder sind schon einem Team zugeordnet.</div>`;
        if(available.length){
          html += `
          <div class="card">
            <div class="stack">
              <div class="field">
                <label>Teamname (optional)</label>
                <input class="input" id="groupTeamName" placeholder="Vorname & Vorname">
              </div>
              <button class="btn btn-secondary" data-action="addLiveTeam" ${state.teamPickSelection.length!==2?"disabled":""}>+ Team aus Auswahl erstellen</button>
            </div>
          </div>`;
        }
      }
    }
    if(org){
      const min = isIndividual ? 4 : (t.type==="ko" ? 2 : 3);
      const count = isIndividual ? t.players.length : t.teams.length;
      html += `<button class="btn btn-primary" style="margin-top:18px;" data-action="beginTournamentPlay" ${count<min?"disabled":""}>Turnier starten</button>`;
    }
    return html;
  }

  function viewDetail(){
    const t = state.current;
    const org = isOrganizer(t);
    const mem = myMembership(t);
    const isIndividual = t.type==="liga" && t.ligaMode==="individual";
    const isKO = t.type==="ko";

    let subtitleEntity = "Zuschauer";
    if(org){
      subtitleEntity = "Turnierleiter";
      if(mem && mem.teamId){
        subtitleEntity += " · " + (isIndividual ? playerName(t, mem.teamId) : teamName(t, mem.teamId));
      }
    } else if(mem && mem.teamId){
      subtitleEntity = isIndividual ? ("Spieler:in: " + playerName(t, mem.teamId)) : ("Team: " + teamName(t, mem.teamId));
    }

    let body;
    if(!t.started){
      body = renderFormingState(t);
    } else if(isKO){
      body = renderKOBracket(t);
    } else if(isIndividual){
      body = state.tab==="table" ? renderIndividualStandings(t) : renderIndividualRounds(t);
    } else {
      body = state.tab==="table" ? renderTeamStandings(t) : renderTeamMatches(t);
    }

    const showTabs = t.started && !isKO;
    const backAttr = t.groupCode ? ` data-action="openGroupDetail" data-code="${esc(t.groupCode)}"` : ` data-action="goHome"`;

    return `
    <div class="topbar">
      <div class="back-btn"${backAttr}>←</div>
      <div>
        <h1${org ? ' data-action="openEditTournamentName" style="cursor:pointer;"' : ''}>${esc(t.name)}${org ? ' <span style="font-size:13px; color:var(--text-soft); text-decoration:underline; text-underline-offset:2px;">ändern</span>' : ''}</h1>
        <div class="sub"><span data-action="openMembers" style="cursor:pointer;">${esc(subtitleEntity)} · <span class="live-dot"></span> live</span>${t.finished ? ' · <span style="color:var(--coral);">beendet</span>' : ''}</div>
      </div>
      <button class="icon-btn" style="font-size:22px;" data-action="openInvite" title="Einladen">＋👤</button>
    </div>
    <div class="screen" style="padding-top:6px;">
      ${t.finished ? `<div class="champion-banner">🏁 Turnier beendet — Punkte wurden der Gruppe gutgeschrieben</div>` : ""}
      ${(!org && !mem) ? `<div class="banner-info" style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px;"><span>Du bist noch nicht beigetreten.</span><button class="btn btn-secondary btn-sm" data-action="joinAsSpectator">Als Zuschauer:in beitreten</button></div>` : ""}
      ${showTabs ? `
      <div class="tabs">
        <div class="tab ${state.tab==='table'?'active':''}" data-action="switchTab" data-tab="table">Tabelle</div>
        <div class="tab ${state.tab==='matches'?'active':''}" data-action="switchTab" data-tab="matches">${isIndividual?'Runden':'Spiele'}</div>
      </div>` : ""}
      ${body}
      ${(t.groupCode && t.started && !t.finished && org) ? `<button class="btn btn-secondary" style="margin-top:18px;" data-action="finishTournament">🏁 Turnier beenden</button>` : ""}
      <button class="btn btn-danger" style="margin-top:14px;" data-action="deleteTournament" data-code="${esc(t.code)}">${org ? "🗑 Turnier löschen" : "Turnier aus meiner Liste entfernen"}</button>
    </div>`;
  }

    if(state.modal==="invite") return modalInvite();
    if(state.modal==="score") return modalScore();
    if(state.modal==="jointeam") return modalJoinTeam();
    if(state.modal==="deleteConfirm") return modalDeleteConfirm();
    if(state.modal==="members") return modalMembers();
    if(state.modal==="reassignTeam") return modalReassignTeam();
    if(state.modal==="removeMember") return modalRemoveMember();

    if(state.modal==="editName") return modalEditName();
    if(state.modal==="editTournamentName") return modalEditTournamentName();
    if(state.modal==="editTeamName") return modalEditTeamName();

  }

  function modalGroupInvite(){
    const g = state.currentGroup;
    return `
    <div class="modal-overlay" data-action="closeModalBg">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <h2>Zur Gruppe einladen</h2>

  function modalScore(){

    const nameB = sideLabel(t,m,"B");
    const winner = m.forced ? (a===b ? null : (a>b?"A":"B")) : setWinner(a,b,target);
    const tiebreak = a>=target && b>=target && !winner;
    const leadA = a>b, leadB = b>a;

    let statusText, statusExtra;
    if(winner){
      const name = winner==="A" ? nameA : nameB;
      statusText = `Satz beendet — <span class="winner">${esc(name)} gewinnt</span>`;

              ${stepperA}

          </div>

  function attachHandlers(){

        }
