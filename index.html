  async function handleAction(action, el){
    if(action==="noop") return;

    if(action==="submitName"){
      const val = document.getElementById("nameInput").value.trim();
      if(!val) return;
      state.identity = await saveIdentity(val);
      await goHome();
      if(state.pendingJoinCode) await tryAutoJoinFromUrl();
      if(state.pendingGroupJoinCode) await tryAutoJoinGroupFromUrl();
      return;
    }
    if(action==="goHome") return goHome();
    if(action==="openEditName"){ state.modal="editName"; state.editNameError=""; return render(); }
    if(action==="saveEditName"){
      const val = document.getElementById("editNameInput").value.trim();
      if(!val){ state.editNameError = "Bitte gib einen Namen ein."; return render(); }
      await updateIdentityName(val);
      state.modal = null; state.modalData = {};
      return render();
    }
    if(action==="openEditTournamentName"){
      const t = state.current;
      if(!isOrganizer(t)) return;
      state.modal = "editTournamentName"; state.editNameError = "";
      return render();
    }
    if(action==="saveEditTournamentName"){
      const t = state.current;
      if(!isOrganizer(t)) return;
      const val = document.getElementById("editTournamentNameInput").value.trim();
      if(!val){ state.editNameError = "Bitte gib einen Namen ein."; return render(); }
      t.name = val;
      await saveTournament(t);
      state.modal = null; state.modalData = {};
      return render();
    }
    if(action==="openEditTeamName"){
      const t = state.current;
      const team = t.teams.find(x=>x.id===el.dataset.team);
      if(!team || !canRemoveLiveTeam(t, team)) return; // gleiche Berechtigung wie Auflösen
      state.modal = "editTeamName";
      state.modalData = { teamId: team.id };
      return render();
    }
    if(action==="saveEditTeamName"){
      const t = state.current;
      const team = t.teams.find(x=>x.id===el.dataset.team);
      if(!team || !canRemoveLiveTeam(t, team)) return;
      const val = document.getElementById("editTeamNameInput").value.trim();
      if(!val) return;
      team.name = val;
      await saveTournament(t);
      state.modal = null; state.modalData = {};
      return render();
    }
    if(action==="backToGroup"){ return openGroupDetail(state.draft && state.draft.groupCode ? state.draft.groupCode : state.currentGroupCode); }
    if(action==="goCreate"){ state.draft = { name:"", type:"liga", ligaMode:"teams", rueckrunde:false, rounds:6, teams:[], players:[] }; state.createError=""; state.view="create"; return render(); }
    if(action==="backToStep1"){ state.createError=""; state.view="create"; return render(); }
    if(action==="goJoin"){ state.joinCode=""; state.joinError=""; state.view="join"; return render(); }

    if(action==="goCreateGroup"){ state.groupCreateError=""; state.view="createGroup"; return render(); }
    if(action==="submitCreateGroup"){
      const name = document.getElementById("groupNameInput").value.trim();
      if(!name){ state.groupCreateError = "Bitte gib einen Gruppennamen ein."; return render(); }
      const code = genCode();
      const g = {
        code, name,
        leaderId: state.identity.id, leaderName: state.identity.name,
        members: [{ userId: state.identity.id, name: state.identity.name, promoted:false }],
        tournamentCodes: [], pointsTable: {}, createdAt: Date.now()
      };
      await saveGroup(g);
      await addMyGroupCode(code);
      return openGroupDetail(code);
    }
    if(action==="goJoinGroup"){ state.groupJoinCode=""; state.groupJoinError=""; state.view="joinGroup"; return render(); }
    if(action==="submitJoinGroup"){
      const code = document.getElementById("groupJoinCodeInput").value.trim().toUpperCase();
      if(!code){ state.groupJoinError="Bitte Code eingeben."; return render(); }
      state.groupJoinLoading = true; state.groupJoinError=""; render();
      const res = await attemptJoinGroup(code);
      state.groupJoinLoading = false;
      if(!res.ok){ state.groupJoinError = "Keine Gruppe mit diesem Code gefunden."; return render(); }
      return openGroupDetail(code);
    }
    if(action==="openGroupDetail") return openGroupDetail(el.dataset.code);

    if(action==="openGroupInvite"){ state.modal="groupInvite"; return render(); }
    if(action==="copyGroupCode"){
      try{ await navigator.clipboard.writeText(state.currentGroup.code); }catch(e){}
      const btn = el; const old = btn.textContent; btn.textContent = "Kopiert ✓"; setTimeout(()=>{ btn.textContent = old; }, 1400);
      return;
    }
    if(action==="shareGroupInvite"){
      const g = state.currentGroup;
      const text = `Tritt unserer Padel-Gruppe „${g.name}" bei! Einfach antippen:\n${groupJoinUrl(g.code)}\n\nOder den Code manuell eingeben: ${g.code}`;
      if(navigator.share){ try{ await navigator.share({ title: "Gruppen-Einladung", text }); }catch(e){} }
      else { try{ await navigator.clipboard.writeText(text); el.textContent="Text kopiert ✓"; setTimeout(()=>render(),1400);}catch(e){} }
      return;
    }
    if(action==="openGroupMembers"){ state.modal="groupMembers"; return render(); }
    if(action==="toggleGroupPromote"){
      const g = state.currentGroup;
      if(!isGroupLeader(g)) return;
      const mem = g.members.find(m=>m.userId===el.dataset.user);
      if(mem){ mem.promoted = !mem.promoted; await saveGroup(g); }
      return render();
    }
    if(action==="removeGroupMember"){
      const g = state.currentGroup;
      if(!isGroupLeader(g)) return;
      const idx = g.members.findIndex(m=>m.userId===el.dataset.user);
      if(idx>=0) g.members.splice(idx,1);
      await saveGroup(g);
      return render();
    }
    if(action==="deleteGroup"){ state.modal="groupDeleteConfirm"; return render(); }
    if(action==="confirmDeleteGroup"){
      const g = state.currentGroup;
      const leader = isGroupLeader(g);
      if(leader) await sDelete("group:"+g.code, true);
      await removeMyGroupCode(g.code);
      state.modal=null; state.modalData={};
      return goHome();
    }

    if(action==="goCreateInGroup"){
      const g = state.currentGroup;
      if(!isGroupAdmin(g)) return;
      state.draft = {
        name:"", type:"liga", ligaMode:"teams", rueckrunde:false, rounds:6, setTarget:6,
        teams:[], players:[], groupCode: g.code, groupMembers: g.members.slice()
      };
      state.createError = "";
      state.teamPickSelection = [];
      state.view = "create";
      return render();
    }

    if(action==="selectType"){ state.draft.type = el.dataset.type; return render(); }
    if(action==="selectLigaMode"){ state.draft.ligaMode = el.dataset.mode; return render(); }
    if(action==="toggleRueckrunde"){ state.draft.rueckrunde = !state.draft.rueckrunde; return render(); }

    if(action==="toCreateTeams"){
      const name = document.getElementById("tournNameInput").value.trim();
      if(!name){ state.createError = "Bitte gib einen Turniernamen ein."; return render(); }
      state.draft.name = name;
      const targetEl = document.getElementById("setTargetInput");
      if(targetEl){
        const tv = parseInt(targetEl.value,10);
        state.draft.setTarget = (!isNaN(tv) && tv>=3) ? Math.min(tv,12) : 6;
      }
      if(state.draft.type==="liga" && state.draft.ligaMode==="individual"){
        const roundsEl = document.getElementById("roundsInput");
        if(roundsEl){
          const rv = parseInt(roundsEl.value,10);
          state.draft.rounds = (!isNaN(rv) && rv>0) ? Math.min(rv,30) : 6;
        }
      }
      state.createError="";
      state.view = "createTeams"; return render();
    }

    if(action==="addTeam"){
      const name = document.getElementById("newTeamName").value.trim();
      const p1 = document.getElementById("newTeamP1").value.trim();
      const p2 = document.getElementById("newTeamP2").value.trim();
      if(!name){ state.createError = "Bitte gib einen Teamnamen ein."; return render(); }
      state.draft.teams.push({ id: uid("t"), name, p1, p2 });
      state.createError = "";
      return render();
    }
    if(action==="removeTeam"){
      const idx = parseInt(el.dataset.idx,10);
      state.draft.teams.splice(idx,1);
      return render();
    }
    if(action==="toggleTeamPick"){
      const uid_ = el.dataset.user;
      const sel = state.teamPickSelection;
      const idx = sel.indexOf(uid_);
      if(idx>=0) sel.splice(idx,1);
      else { if(sel.length>=2) sel.shift(); sel.push(uid_); }
      return render();
    }
    if(action==="addTeamFromGroup"){
      const d = state.draft;
      if(state.teamPickSelection.length!==2) return;
      const [id1,id2] = state.teamPickSelection;
      const m1 = (d.groupMembers||[]).find(m=>m.userId===id1);
      const m2 = (d.groupMembers||[]).find(m=>m.userId===id2);
      if(!m1 || !m2) return;
      const nameInput = document.getElementById("groupTeamName");
      const customName = nameInput ? nameInput.value.trim() : "";
      const name = customName || `${m1.name} & ${m2.name}`;
      d.teams.push({ id: uid("t"), name, p1:m1.name, p2:m2.name, memberUserIds:[id1,id2] });
      state.teamPickSelection = [];
      state.createError = "";
      return render();
    }
    if(action==="addPlayer"){
      const name = document.getElementById("newPlayerName").value.trim();
      if(!name){ state.createError = "Bitte gib einen Namen ein."; return render(); }
      state.draft.players.push({ id: uid("p"), name });
      state.createError = "";
      return render();
    }
    if(action==="removePlayer"){
      const idx = parseInt(el.dataset.idx,10);
      state.draft.players.splice(idx,1);
      return render();
    }

    if(action==="startTournament"){
      const d = state.draft;
      const inGroup = !!d.groupCode;
      const code = genCode();
      const t = {
        code,
        name: d.name,
        type: d.type,
        setTarget: d.setTarget || 6,
        organizerId: state.identity.id,
        organizerName: state.identity.name,
        groupCode: d.groupCode || null,
        teams: [],
        players: [],
        members: [],
        matches: [],
        ligaRounds: [],
        started: !inGroup,
        finished: false,
        pointsAwarded: false,
        createdAt: Date.now()
      };

      if(d.type==="liga"){
        t.ligaMode = d.ligaMode;
        if(d.ligaMode==="teams"){
          if(!inGroup && d.teams.length<3) return;
          t.teams = d.teams;
          t.rueckrunde = !!d.rueckrunde;
          const courtsEl = document.getElementById("courtsInput");
          let courts = 1;
          if(courtsEl){
            const cv = parseInt(courtsEl.value,10);
            courts = (!isNaN(cv) && cv>0) ? Math.min(cv,20) : Math.max(1, Math.floor((d.teams.length||2)/2));
          }
          t.courts = courts;
        } else {
          if(inGroup){
            if(!d.groupMembers || d.groupMembers.length<4) return;
            t.players = d.groupMembers.map(m=>({ id:m.userId, name:m.name }));
          } else {
            if(d.players.length<4) return;
            t.players = d.players;
          }
          t.rounds = d.rounds || 6;
        }
      } else if(d.type==="ko"){
        if(!inGroup && d.teams.length<2) return;
        t.teams = d.teams;
      }

      if(inGroup){
        t.groupMemberRoster = d.groupMembers;
        if(t.ligaMode==="individual"){
          t.members = t.players.map(p=>({ userId:p.id, name:p.name, teamId:p.id }));
        } else {
          t.teams.forEach(team=>{
            (team.memberUserIds||[]).forEach(uid_=>{
              const gm = d.groupMembers.find(m=>m.userId===uid_);
              t.members.push({ userId: uid_, name: gm?gm.name:"?", teamId: team.id });
            });
          });
        }
        if(!t.members.find(m=>m.userId===state.identity.id)){
          t.members.push({ userId: state.identity.id, name: state.identity.name, teamId: null });
        }
        await saveTournament(t);
        const g = await loadGroup(d.groupCode);
        if(g){ g.tournamentCodes.push(code); await saveGroup(g); }
        state.draft = null;
        return openGroupDetail(d.groupCode);
      }

      t.members = [{ userId: state.identity.id, name: state.identity.name, teamId: null }];
      generateMatchesForTournament(t);
      await saveTournament(t);
      await addMyCode(code);
      state.draft = null;
      return openDetail(code);
    }

    if(action==="submitJoin"){
      const code = document.getElementById("joinCodeInput").value.trim().toUpperCase();
      if(!code){ state.joinError="Bitte Code eingeben."; return render(); }
      state.joinLoading = true; state.joinError = "";
      render();
      const res = await attemptJoin(code);
      state.joinLoading = false;
      if(!res.ok){
        state.joinError = "Kein Turnier mit diesem Code gefunden.";
        return render();
      }
      return enterJoinedTournament(res.t, res.mem, code);
    }

    if(action==="openDetail") return openDetail(el.dataset.code);

    if(action==="deleteTournament"){
      const code = el.dataset.code;
      const cached = (state.myTournaments||[]).find(x=>x.code===code) || (state.currentGroupTournaments||[]).find(x=>x.code===code);
      const t = (state.current && state.current.code===code) ? state.current : cached;
      const isOrg = t ? isOrganizer(t) : false;
      const name = t ? t.name : code;
      const groupCode = t ? t.groupCode : null;
      state.modal = "deleteConfirm";
      state.modalData = { code, isOrg, name, groupCode };
      return render();
    }
    if(action==="confirmDelete"){
      const { code, isOrg, groupCode } = state.modalData;
      if(isOrg){
        await sDelete("tournament:"+code, true);
        if(groupCode){
          const g = await loadGroup(groupCode);
          if(g){
            g.tournamentCodes = (g.tournamentCodes||[]).filter(c=>c!==code);
            await saveGroup(g);
            if(state.currentGroupCode===groupCode){
              state.currentGroup = g;
              await refreshGroupTournaments(g);
            }
          }
        }
      }
      await removeMyCode(code);
      if(state.currentCode===code){
        stopPolling();
        state.modal = null; state.modalData = {};
        return goHome();
      }
      state.modal = null; state.modalData = {};
      await refreshMyTournamentsList();
      return render();
    }

    if(action==="switchTab"){ state.tab = el.dataset.tab; return render(); }
    if(action==="setMatchFilter"){ state.matchFilter = el.dataset.filter; return render(); }
    if(action==="openTeamMatches"){
      state.modal = "teamMatches";
      state.modalData = { teamId: el.dataset.team };
      return render();
    }

    if(action==="startRueckrunde"){
      const t = state.current;
      if(!isOrganizer(t) || t.rueckrunde) return;
      if(t.type==="liga" && t.ligaMode==="teams"){
        const rueck = buildLegMatches(t.teams, "Rueck", t.courts||1).map(m=>({ ...m, teamAId:m.teamBId, teamBId:m.teamAId }));
        t.matches = t.matches.concat(rueck);
        t.rueckrunde = true;
      } else if(t.type==="liga" && t.ligaMode==="individual"){
        const extra = t.rounds || 6;
        const seed = buildAmericanoCounts(t.players, t.ligaRounds);
        const newRounds = generateAmericanoRounds(t.players, extra, t.ligaRounds.length, seed);
        t.rueckrundeStartIndex = t.ligaRounds.length;
        t.ligaRounds = t.ligaRounds.concat(newRounds);
        t.rueckrunde = true;
      } else {
        return;
      }
      await saveTournament(t);
      return render();
    }

    if(action==="addLiveTeam"){
      const t = state.current;
      if(t.started || !canFormTeams(t)) return;
      if(state.teamPickSelection.length!==2) return;
      const [id1,id2] = state.teamPickSelection;
      const m1 = (t.groupMemberRoster||[]).find(m=>m.userId===id1);
      const m2 = (t.groupMemberRoster||[]).find(m=>m.userId===id2);
      if(!m1 || !m2) return;
      const nameInput = document.getElementById("groupTeamName");
      const customName = nameInput ? nameInput.value.trim() : "";
      const name = customName || `${m1.name} & ${m2.name}`;
      t.teams.push({ id: uid("t"), name, p1:m1.name, p2:m2.name, memberUserIds:[id1,id2] });
      [id1,id2].forEach(uidX=>{
        if(!t.members.find(m=>m.userId===uidX)){
          t.members.push({ userId:uidX, name:(uidX===id1?m1.name:m2.name), teamId: t.teams[t.teams.length-1].id });
        } else {
          t.members.find(m=>m.userId===uidX).teamId = t.teams[t.teams.length-1].id;
        }
      });
      state.teamPickSelection = [];
      await saveTournament(t);
      return render();
    }
    if(action==="removeLiveTeam"){
      const t = state.current;
      if(t.started) return;
      const teamId = el.dataset.team;
      const team = t.teams.find(x=>x.id===teamId);
      if(!team || !canRemoveLiveTeam(t, team)) return;
      t.teams = t.teams.filter(x=>x.id!==teamId);
      (team.memberUserIds||[]).forEach(uidX=>{
        const mem = t.members.find(m=>m.userId===uidX);
        if(mem) mem.teamId = null;
      });
      await saveTournament(t);
      return render();
    }
    if(action==="beginTournamentPlay"){
      const t = state.current;
      if(!isOrganizer(t) || t.started) return;
      const isIndividual = t.type==="liga" && t.ligaMode==="individual";
      const min = isIndividual ? 4 : (t.type==="ko" ? 2 : 3);
      const count = isIndividual ? t.players.length : t.teams.length;
      if(count<min) return;
      generateMatchesForTournament(t);
      await saveTournament(t);
      return render();
    }
    if(action==="finishTournament"){
      const t = state.current;
      if(!isOrganizer(t) || !t.started || t.finished) return;
      t.finished = true;
      if(!t.pointsAwarded && t.groupCode){
        const g = await loadGroup(t.groupCode);
        if(g){
          creditGroupPoints(g, t);
          await saveGroup(g);
          t.pointsAwarded = true;
        }
      }
      await saveTournament(t);
      return render();
    }

    if(action==="openInvite"){ state.modal="invite"; return render(); }
    if(action==="openMembers"){ state.modal="members"; return render(); }
    if(action==="joinAsSpectator"){
      const t = state.current;
      if(!t || isOrganizer(t) || myMembership(t)) return;
      t.members.push({ userId: state.identity.id, name: state.identity.name, teamId: null });
      await saveTournament(t);
      await addMyCode(t.code);
      return render();
    }
    if(action==="togglePromote"){
      const t = state.current;
      if(!isOrganizer(t)) return;
      const mem = t.members.find(x=>x.userId===el.dataset.user);
      if(mem){
        mem.promoted = !mem.promoted;
        await saveTournament(t);
      }
      return render();
    }
    if(action==="openReassign"){
      state.modal = "reassignTeam";
      state.modalData = { userId: el.dataset.user, name: el.dataset.name };
      return render();
    }
    if(action==="setMemberTeam"){
      const t = state.current;
      if(!isOrganizer(t)) return;
      const mem = t.members.find(x=>x.userId===el.dataset.user);
      if(mem) mem.teamId = el.dataset.team || null;
      await saveTournament(t);
      state.modal = "members"; state.modalData = {};
      return render();
    }
    if(action==="openRemoveMember"){
      state.modal = "removeMember";
      state.modalData = { userId: el.dataset.user, name: el.dataset.name };
      return render();
    }
    if(action==="confirmRemoveMember"){
      const t = state.current;
      if(!isOrganizer(t)) return;
      const idx = t.members.findIndex(x=>x.userId===el.dataset.user);
      if(idx>=0) t.members.splice(idx,1);
      await saveTournament(t);
      state.modal = "members"; state.modalData = {};
      return render();
    }
    if(action==="backToMembers"){ state.modal = "members"; state.modalData = {}; return render(); }

    if(action==="closeModal" || action==="closeModalBg"){ state.modal=null; state.modalData={}; return render(); }

    if(action==="copyCode"){
      try{ await navigator.clipboard.writeText(state.current.code); }catch(e){}
      const btn = el; const old = btn.textContent; btn.textContent = "Kopiert ✓"; setTimeout(()=>{ btn.textContent = old; }, 1400);
      return;
    }
    if(action==="shareInvite"){
      const t = state.current;
      const text = `Du bist eingeladen zum Padel-Turnier „${t.name}"! Einfach antippen zum Beitreten:\n${joinUrl(t.code)}\n\nOder den Code manuell eingeben: ${t.code}`;
      if(navigator.share){ try{ await navigator.share({ title: "Padel Turnier Einladung", text }); }catch(e){} }
      else { try{ await navigator.clipboard.writeText(text); el.textContent="Text kopiert ✓"; setTimeout(()=>render(),1400);}catch(e){} }
      return;
    }

    if(action==="chooseTeam"){
      const teamId = el.dataset.team || null;
      const t = state.current;
      const mem = t.members.find(m=>m.userId===state.identity.id);
      if(mem) mem.teamId = teamId;
      await saveTournament(t);
      state.modal = null; state.modalData = {};
      return render();
    }

    if(action==="openScore"){
      const t = state.current;
      const roundIndex = (el.dataset.round!==undefined && el.dataset.round!=="") ? parseInt(el.dataset.round,10) : null;
      const m = roundIndex!=null ? t.ligaRounds[roundIndex].matches.find(x=>x.id===el.dataset.match) : t.matches.find(x=>x.id===el.dataset.match);
      const s = m.sets[0];
      state.modal = "score";
      state.modalData = { matchId: m.id, roundIndex, a: s?s.a:0, b: s?s.b:0, error:"" };
      return render();
    }
    if(action==="courtStep"){
      const t = state.current;
      const m = findModalMatch();
      if(!canEditMatch(t, m)) return;
      const team = el.dataset.team;
      const delta = parseInt(el.dataset.delta,10);
      const key = team==="A" ? "a" : "b";
      const target = t.setTarget || 6;
      state.modalData[key] = Math.max(0, Math.min(target+1, (state.modalData[key]||0) + delta));
      state.modalData.error = "";
      // sofort live speichern, damit Zuschauer den Zwischenstand sehen — zählt aber erst nach
      // explizitem "Ergebnis speichern" als offiziell beendet (siehe evaluateMatch).
      m.sets = [{ a: state.modalData.a||0, b: state.modalData.b||0 }];
      m.forced = false;
      m.confirmed = false;
      if(t.type==="ko") propagateKO(t);
      await saveTournament(t);
      return render();
    }
    if(action==="saveScore"){
      const t = state.current;
      const m = findModalMatch();
      if(!canEditMatch(t, m)) return;
      const target = t.setTarget || 6;
      const a = state.modalData.a||0, b = state.modalData.b||0;
      const w = setWinner(a,b,target);
      if(!w){
        state.modalData.error = `Der Satz ist noch nicht entschieden (bis ${target} mit 2 Spielen Vorsprung, oder Tiebreak bis ${target+1}).`;
        return render();
      }
      m.sets = [{ a, b }];
      m.forced = false;
      m.confirmed = true;
      if(t.type==="ko") propagateKO(t);
      await saveTournament(t);
      state.modal = null; state.modalData = {};
      return render();
    }
    if(action==="forceFinish"){
      const t = state.current;
      const m = findModalMatch();
      if(!canEditMatch(t, m)) return;
      const a = state.modalData.a||0, b = state.modalData.b||0;
      if(a===b) return;
      m.sets = [{ a, b }];
      m.forced = true;
      m.confirmed = true;
      if(t.type==="ko") propagateKO(t);
      await saveTournament(t);
      state.modal = null; state.modalData = {};
      return render();
    }
  }

  // ---------- Boot ----------
  async function boot(){
    try{
      const params = new URLSearchParams(window.location.search);
      const joinParam = params.get("join");
      const joinGroupParam = params.get("joinGroup");
      if(joinParam){
        state.pendingJoinCode = joinParam.trim().toUpperCase();
      }
      if(joinGroupParam){
        state.pendingGroupJoinCode = joinGroupParam.trim().toUpperCase();
      }
      if(joinParam || joinGroupParam){
        history.replaceState(null, "", window.location.pathname);
      }
    }catch(e){ /* ignore malformed URLs */ }

    state.identity = await loadIdentity();
    if(!state.identity){ state.view = "onboarding"; return render(); }
    await refreshMyTournamentsList();
    await refreshMyGroupsList();
    state.view = "home";
    render();
    if(state.pendingJoinCode) await tryAutoJoinFromUrl();
    if(state.pendingGroupJoinCode) await tryAutoJoinGroupFromUrl();
  }
  boot();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW registration failed", err));
    });
  }
})();
</script>
</body>
</html>
